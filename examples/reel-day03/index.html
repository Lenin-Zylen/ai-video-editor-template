<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo-var.ttf") format("truetype");
        font-weight: 100 900;
        font-stretch: 62% 125%;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0d1117;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      /* Face: bottom half of the split. Wrappers are untimed; the video is the clip. */
      #face-frame {
        position: absolute;
        left: 0;
        top: 960px;
        width: 1080px;
        height: 960px;
        overflow: hidden;
        background: #0d1117;
      }
      #face-zoom {
        position: absolute;
        inset: 0;
        transform-origin: 50% 30%;
      }
      #a-roll {
        position: absolute;
        left: 0;
        top: -380px;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="27.86"
      data-width="1080"
      data-height="1920"
    >
      <div id="face-frame" data-layout-allow-overflow>
        <div id="face-zoom">
          <video
            id="a-roll"
            class="clip"
            src="assets/cut.mp4"
            playsinline
            data-start="0"
            data-duration="27.86"
            data-track-index="0"
            data-has-audio="true"
          ></video>
        </div>
      </div>

      <!-- Scenes in film order. Each split scene runs 0.35 s past its slot so the next one
           can wipe in over it while it drifts back; later scenes paint above earlier ones. -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2.0" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 20"></div>
      <div id="day" data-composition-id="day" data-composition-src="compositions/day.html"
        data-start="2.0" data-duration="3.117" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 11"></div>
      <div id="dots" data-composition-id="dots" data-composition-src="compositions/dots.html"
        data-start="4.767" data-duration="3.0" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 12"></div>
      <div id="trycard" data-composition-id="trycard" data-composition-src="compositions/trycard.html"
        data-start="7.767" data-duration="0.95" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 21"></div>
      <div id="connect" data-composition-id="connect" data-composition-src="compositions/connect.html"
        data-start="8.367" data-duration="3.75" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 13"></div>
      <div id="prompt" data-composition-id="prompt" data-composition-src="compositions/prompt.html"
        data-start="11.767" data-duration="7.483" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 14"></div>
      <div id="confirm" data-composition-id="confirm" data-composition-src="compositions/confirm.html"
        data-start="18.9" data-duration="1.983" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 15"></div>
      <div id="result" data-composition-id="result" data-composition-src="compositions/result.html"
        data-start="20.533" data-duration="4.117" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 16"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="24.3" data-duration="3.56" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 17"></div>

      <!-- Brand signature: progress bar + step counter -->
      <div id="hud" data-composition-id="hud" data-composition-src="compositions/hud.html"
        data-start="2.0" data-duration="25.86" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 30"></div>

      <!-- Every caption group lives in this one host -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="27.86" data-track-index="4" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 40"></div>

      <!-- Music bed: "Good Vibe Background Music" by Seth_Makes_Sounds, CC0 1.0, freesound.org/s/661782.
           Enters at 8 s into the track (already full); sits under the voice at 0.14. -->
      <audio id="music" class="clip" src="assets/music/good-vibe-background-music.mp3" data-start="0" data-duration="27.86"
        data-media-start="8" data-track-index="10" data-volume="0.14" data-fade-in="0.2" data-fade-out="0.6"></audio>

      <!-- Sound on visible actions only. data-start = hit time - the file's peak + 1 frame. -->
      <audio id="sfx-pop-day" class="clip" src="assets/sfx/pop.mp3" data-start="2.743" data-duration="0.72" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-pop-dots" class="clip" src="assets/sfx/pop.mp3" data-start="5.53" data-duration="0.72" data-track-index="5" data-volume="0.3"></audio>
      <audio id="sfx-whoosh-try" class="clip" src="assets/sfx/whoosh.mp3" data-start="7.638" data-duration="0.575" data-track-index="6" data-volume="0.3"></audio>
      <audio id="sfx-whoosh-through" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="8.418" data-duration="0.575" data-track-index="6" data-volume="0.22"></audio>
      <audio id="sfx-typing-1" class="clip" src="assets/sfx/typing.mp3" data-start="11.4" data-duration="1.5" data-track-index="7" data-volume="0.2"></audio>
      <audio id="sfx-typing-2" class="clip" src="assets/sfx/typing.mp3" data-start="16.3" data-duration="1.5" data-track-index="7" data-volume="0.16"></audio>
      <audio id="sfx-pop-chip" class="clip" src="assets/sfx/pop.mp3" data-start="17.93" data-duration="0.72" data-track-index="5" data-volume="0.28"></audio>
      <audio id="sfx-click" class="clip" src="assets/sfx/click.mp3" data-start="19.91" data-duration="0.366" data-track-index="5" data-volume="0.4"></audio>
      <audio id="sfx-whoosh-payoff" class="clip" src="assets/sfx/whoosh.mp3" data-start="20.404" data-duration="0.575" data-track-index="6" data-volume="0.26"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="21.043" data-duration="2.116" data-track-index="7" data-volume="0.35"></audio>
      <audio id="sfx-notify" class="clip" src="assets/sfx/notification.mp3" data-start="21.337" data-duration="2.456" data-track-index="5" data-volume="0.18"></audio>
      <audio id="sfx-key-1" class="clip" src="assets/sfx/key-press.mp3" data-start="24.957" data-duration="0.4" data-track-index="6" data-volume="0.25"></audio>
      <audio id="sfx-key-2" class="clip" src="assets/sfx/key-press.mp3" data-start="25.067" data-duration="0.4" data-track-index="7" data-volume="0.22"></audio>
      <audio id="sfx-key-3" class="clip" src="assets/sfx/key-press.mp3" data-start="25.177" data-duration="0.4" data-track-index="8" data-volume="0.25"></audio>
      <audio id="sfx-key-4" class="clip" src="assets/sfx/key-press.mp3" data-start="25.287" data-duration="0.4" data-track-index="9" data-volume="0.22"></audio>
      <audio id="sfx-pop-send" class="clip" src="assets/sfx/pop.mp3" data-start="26.163" data-duration="0.72" data-track-index="5" data-volume="0.3"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // Punch-ins on the face: hard cuts 100% <-> 112% on key lines
      tl.set("#face-zoom", { scale: 1 }, 0);
      tl.set("#face-zoom", { scale: 1.12 }, 4.767);
      tl.set("#face-zoom", { scale: 1 }, 7.767);
      tl.set("#face-zoom", { scale: 1.12 }, 18.9);
      tl.set("#face-zoom", { scale: 1 }, 24.3);
      // Full-screen graphics, voice only: "Connect ... ask before sending." and the payoff line
      tl.fromTo("#face-frame", { y: 0 }, { y: 960, duration: 0.4, ease: "power3.inOut" }, 9.53);
      tl.to("#face-frame", { y: 0, duration: 0.4, ease: "power3.inOut" }, 18.9);
      tl.to("#face-frame", { y: 960, duration: 0.4, ease: "power3.inOut" }, 20.533);
      tl.to("#face-frame", { y: 0, duration: 0.4, ease: "power3.inOut" }, 24.3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
